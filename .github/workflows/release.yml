name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Ворота уязвимостей ДО сборки: релиз с известной high/critical не
  # собирается вовсе. Те же проверки, что job `security` в nodejs.yml, плюс
  # строже одно: Electron обязан стоять на последнем патче своей линии —
  # Chromium-исправления приходят патч-релизами Electron, и в CI отставание
  # лишь предупреждение. Подробно: docs/ci.md.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: npm audit (high и выше блокирует, dev включён)
        run: npm audit --audit-level=high
      - name: SBOM совпадает с lockfile
        run: node scripts/security-gate.js sbom-sync
      - name: Prepare SBOM for OSV-Scanner
        run: cp sbom.json sbom.cdx.json && rm -f osv-results.json
      - name: OSV-Scanner (lockfile + SBOM)
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --all-packages
            --output-file=osv-results.json
            --config=osv-scanner.toml
            --lockfile=package-lock.json
            --lockfile=sbom.cdx.json
      - name: Gate on OSV findings (high/critical или без оценки — провал)
        run: node scripts/security-gate.js osv osv-results.json
      - name: Electron — последний патч своей линии (иначе провал)
        run: node scripts/security-gate.js electron --require-latest

  build-macos-intel:
    needs: security
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build macOS Intel
        run: npx electron-builder --mac --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-intel
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 5

  build-macos-arm:
    needs: security
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build macOS ARM
        run: npx electron-builder --mac --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 5

  build-windows:
    needs: security
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Windows
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.exe
          retention-days: 5

  build-linux:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Linux
        run: npx electron-builder --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Проверяется ТОТ пакет, что уходит в релиз, а не соседняя сборка из CI:
      # песочница и профиль AppArmor видны только в готовом postinst.
      - name: Verify sandbox setup in the shipped package
        run: node scripts/verify-linux-sandbox.js

      # Скан ТОГО deb, что уходит в релиз: Grype по распакованному пакету и
      # app.asar, версия Electron в бинаре = lockfile = SBOM. Как job
      # `deb-scan` в nodejs.yml.
      - name: Unpack deb and app.asar for scanning
        run: |
          DEB=$(ls dist/*.deb)
          dpkg-deb -x "$DEB" scan-root
          ASAR=$(find scan-root -path '*/resources/app.asar')
          npx --yes @electron/asar@3.4.1 extract "$ASAR" scan-root/app-asar-extracted

      - name: Electron в бинаре = lockfile = SBOM
        run: node scripts/security-gate.js electron --binary "$(find scan-root/opt -maxdepth 2 -name timer-widget -type f)" --require-latest

      # Grype по каталогу видит 0 пакетов — SBOM строит syft с
      # каталогизаторами образа, полнота проверяется (см. deb-scan в nodejs.yml).
      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: SBOM of the shipped deb
        run: ${{ steps.syft.outputs.cmd }} dir:scan-root --override-default-catalogers image -o cyclonedx-json=deb-sbom.cdx.json -o table

      - name: SBOM артефакта не пуст
        run: node scripts/security-gate.js artifact-sbom deb-sbom.cdx.json

      - name: Grype on the shipped deb (high/critical блокирует)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: deb-sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: table
          config: .grype.yaml

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.deb
          retention-days: 5

  release:
    needs: [build-macos-intel, build-macos-arm, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      # Описание релиза собирается из CHANGELOG.md, а не пишется здесь руками.
      # Раньше тело было захардкожено (~70 строк markdown) и к версии 2.4.0 врало:
      # заголовок «Что нового в v2.3», обещание «Linux: chrome-sandbox без SUID,
      # приложение с --no-sandbox» (стало наоборот) и устаревшая инструкция для
      # macOS «правый клик → Открыть». Текст, живущий отдельно от кода, расходится
      # с ним молча — тот же дефект, что была врущая справка внутри приложения.
      - name: Build release notes from CHANGELOG
        run: node scripts/release-notes.js "${{ github.ref_name }}" --out RELEASE_NOTES.md

      # Имена в файле — ПЛОСКИЕ, без папок артефактов: скачивают файлы по
      # одному в свой каталог, и `sha256sum -c SHA256SUMS.txt` с путями вида
      # `windows/…` не сходится. Проверка, которая не проверяется, — то же
      # обещание без исполнения (у 2.6.0 файл пришлось перезаливать руками).
      # Контрольные суммы прикладываются к релизу, потому что сборки НЕ
      # ПОДПИСАНЫ: сертификата у проекта нет, система при первом запуске
      # предупреждает, и единственный способ отличить «просто неподписанный
      # файл» от «файла, изменённого по дороге» — сверить сумму. Описание
      # релиза на этот файл ссылается, а обещание без исполнения в этом
      # репозитории считается дефектом.
      - name: Checksums for downloads
        run: |
          cd artifacts
          find . -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
            -o -name '*.deb' \) -print0 \
            | sort -z | xargs -0 sha256sum \
            | sed 's| .*/| |' > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "TimerWidget ${{ github.ref_name }}"
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          # sbom.json прикладывается К РЕЛИЗУ, а не кладётся внутрь app.asar.
          # Внутри приложения его не читает никто — это артефакт цепочки
          # поставки, а не рантайма, и он занимал 812 КБ из 2241 КБ всего кода
          # приложения (36%). Здесь он остаётся доступен тем, кому нужен:
          # аудиту, сканерам, корпоративной приёмке.
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.deb
            SHA256SUMS.txt
            sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
