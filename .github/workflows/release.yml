name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Ворота уязвимостей ДО сборки: релиз с известной high/critical не
  # собирается вовсе. Те же проверки, что job `security` в nodejs.yml, плюс
  # строже одно: Electron обязан стоять на последнем патче своей линии —
  # Chromium-исправления приходят патч-релизами Electron, и в CI отставание
  # лишь предупреждение. Подробно: docs/ci.md.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify release tag and changelog
        run: node scripts/release-notes.js "$GITHUB_REF_NAME" --out RELEASE_NOTES.md
      - name: npm audit (high и выше блокирует, dev включён)
        run: npm audit --audit-level=high
      - name: SBOM совпадает с lockfile
        run: node scripts/security-gate.js sbom-sync
      - name: Prepare SBOM for OSV-Scanner
        run: cp sbom.json sbom.cdx.json && rm -f osv-results.json
      - name: OSV-Scanner (lockfile + SBOM)
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --all-packages
            --output-file=osv-results.json
            --config=osv-scanner.toml
            --lockfile=package-lock.json
            --lockfile=sbom.cdx.json
      - name: Gate on OSV findings (high/critical или без оценки — провал)
        run: node scripts/security-gate.js osv osv-results.json
      - name: Electron — последний патч своей линии (иначе провал)
        run: node scripts/security-gate.js electron --require-latest

  build-macos-intel:
    needs: security
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # Храповик tsc --checkJs (scripts/typecheck.js) — те же ворота, что в CI.
      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build macOS Intel
        run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Check documented minimum macOS against packaged Info.plist
        run: |
          plist=(dist/mac*/*.app/Contents/Info.plist)
          minimum=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "${plist[0]}")
          test "$minimum" = "$(node -p "require('./scripts/release-notes').MAC_MINIMUM")"

      - name: Verify the packaged app
        run: node scripts/verify-packed.js

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-intel
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 5

  build-macos-arm:
    needs: security
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # Храповик tsc --checkJs (scripts/typecheck.js) — те же ворота, что в CI.
      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run end-to-end tests on the tagged commit
        run: npx playwright test

      - name: Build macOS ARM
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Check documented minimum macOS against packaged Info.plist
        run: |
          plist=(dist/mac*/*.app/Contents/Info.plist)
          minimum=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "${plist[0]}")
          test "$minimum" = "$(node -p "require('./scripts/release-notes').MAC_MINIMUM")"

      - name: Verify the packaged app
        run: node scripts/verify-packed.js

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 5

  build-windows:
    needs: security
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # Храповик tsc --checkJs (scripts/typecheck.js) — те же ворота, что в CI.
      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run end-to-end tests on the tagged commit
        run: npx playwright test

      - name: Build Windows
        run: npx electron-builder --win --publish never

      - name: Verify the packaged app
        run: node scripts/verify-packed.js

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 5

  build-linux:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # Храповик tsc --checkJs (scripts/typecheck.js) — те же ворота, что в CI.
      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Prepare Electron sandbox for the Linux runtime
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Run end-to-end tests on the tagged commit
        run: xvfb-run --auto-servernum npx playwright test

      - name: Build Linux
        run: npx electron-builder --linux --publish never

      # Проверяется ТОТ пакет, что уходит в релиз, а не соседняя сборка из CI:
      # песочница и профиль AppArmor видны только в готовом postinst.
      - name: Verify sandbox setup in the shipped package
        run: node scripts/verify-linux-sandbox.js

      # lintian по ТОМУ deb, что уходит в релиз, — тем же скриптом, что CI.
      - name: lintian (error валит релиз)
        run: bash scripts/lintian-check.sh "$(ls dist/*.deb)"

      # Скан ТОГО deb, что уходит в релиз: Grype по распакованному пакету и
      # app.asar, версия Electron в бинаре = lockfile = SBOM. Как job
      # `deb-scan` в nodejs.yml.
      - name: Unpack deb and app.asar for scanning
        run: |
          DEB=$(ls dist/*.deb)
          dpkg-deb -x "$DEB" scan-root
          ASAR=$(find scan-root -path '*/resources/app.asar')
          npx --yes @electron/asar@3.4.1 extract "$ASAR" scan-root/app-asar-extracted

      - name: Electron в бинаре = lockfile = SBOM
        run: node scripts/security-gate.js electron --binary "$(find scan-root/opt -maxdepth 2 -name timer-widget -type f)" --require-latest

      # Grype по каталогу видит 0 пакетов — SBOM строит syft с
      # каталогизаторами образа, полнота проверяется (см. deb-scan в nodejs.yml).
      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: SBOM of the shipped deb
        run: ${{ steps.syft.outputs.cmd }} dir:scan-root --override-default-catalogers image -o cyclonedx-json=deb-sbom.cdx.json -o table

      - name: SBOM артефакта не пуст
        run: node scripts/security-gate.js artifact-sbom deb-sbom.cdx.json

      - name: Grype on the shipped deb (high/critical блокирует)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: deb-sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: table
          config: .grype.yaml

      - name: Verify the packaged app
        run: node scripts/verify-packed.js

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/*.deb
          if-no-files-found: error
          retention-days: 5

  release:
    permissions:
      contents: write
    needs: [build-macos-intel, build-macos-arm, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Verify the seven downloads
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "macos-intel/TimerWidget-$version-x64.dmg"
            "macos-intel/TimerWidget-$version-x64.zip"
            "macos-arm/TimerWidget-$version-arm64.dmg"
            "macos-arm/TimerWidget-$version-arm64.zip"
            "windows/TimerWidget-Setup-$version.exe"
            "windows/TimerWidget-Portable.exe"
            "linux/TimerWidget-$version-amd64.deb"
          )
          cd artifacts
          for file in "${expected[@]}"; do test -s "$file"; done
          diff <(printf '%s\n' "${expected[@]}" | sort) <(find . -type f | sed 's|^\./||' | sort)

      # Описание релиза собирается из CHANGELOG.md, а не пишется здесь руками.
      # Раньше тело было захардкожено (~70 строк markdown) и к версии 2.4.0 врало:
      # заголовок «Что нового в v2.3», обещание «Linux: chrome-sandbox без SUID,
      # приложение с --no-sandbox» (стало наоборот) и устаревшая инструкция для
      # macOS «правый клик → Открыть». Текст, живущий отдельно от кода, расходится
      # с ним молча — тот же дефект, что была врущая справка внутри приложения.
      - name: Build release notes from CHANGELOG
        run: node scripts/release-notes.js "$GITHUB_REF_NAME" --out RELEASE_NOTES.md

      # Имена в файле — ПЛОСКИЕ, без папок артефактов: скачивают файлы по
      # одному в свой каталог, и `sha256sum -c SHA256SUMS.txt` с путями вида
      # `windows/…` не сходится. Проверка, которая не проверяется, — то же
      # обещание без исполнения (у 2.6.0 файл пришлось перезаливать руками).
      # Контрольные суммы прикладываются к релизу, потому что сборки НЕ
      # ПОДПИСАНЫ: сертификата у проекта нет, система при первом запуске
      # предупреждает, и единственный способ отличить «просто неподписанный
      # файл» от «файла, изменённого по дороге» — сверить сумму. Описание
      # релиза на этот файл ссылается, а обещание без исполнения в этом
      # репозитории считается дефектом.
      - name: Checksums for downloads
        run: |
          cd artifacts
          find . -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
            -o -name '*.deb' \) -print0 \
            | sort -z | xargs -0 sha256sum \
            | sed 's| .*/| |' > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: "TimerWidget ${{ github.ref_name }}"
          fail_on_unmatched_files: true
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          # sbom.json прикладывается К РЕЛИЗУ, а не кладётся внутрь app.asar.
          # Внутри приложения его не читает никто — это артефакт цепочки
          # поставки, а не рантайма, и он занимал 812 КБ из 2241 КБ всего кода
          # приложения (36%). Здесь он остаётся доступен тем, кому нужен:
          # аудиту, сканерам, корпоративной приёмке.
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.deb
            SHA256SUMS.txt
            sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
