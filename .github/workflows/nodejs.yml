name: Node.js CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Ручной запуск. Добавлен 26.08.2026 после инцидента GitHub Actions
  # (деградация с 15:11 UTC, троттлинг и отмена задач): прогоны для двух
  # коммитов подряд либо отменились, либо встали в очередь с НУЛЁМ джоб, а
  # для третьего не создались вовсе. Пересобрать их было нечем — единственным
  # триггером был push, то есть починка сбоя инфраструктуры требовала лишнего
  # коммита в историю.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
      # Визуальная регрессия: поднимаем окна Electron в виртуальном дисплее и
      # сверяем снимки с эталонами из tests/visual-baseline/. Ловит то, что
      # юнит-тесты в принципе не видят — например «жёлтый ноль» и зелёную плашку
      # «ВРЕМЯ ВЫШЛО!», которые прожили в проекте месяцами.
      #
      # Эталоны (tests/visual-baseline/) в репозиторий не кладутся — это 8.6 МБ
      # PNG, которые росли бы с каждой визуальной правкой. Без них шаг не сверяет
      # картинки, а проверяет, что приложение вообще поднимается и снимает все
      # окна под xvfb. Чтобы шаг сверял ещё и КАРТИНКИ, эталоны надо снимать на
      # самом раннере: рендеринг ubuntu отличается от macOS.
      #
      # ВНИМАНИЕ: до 2.4.0 этот шаг не делал на ubuntu ни одного снимка. Electron
      # падал с exit 133 ещё до первого кадра, а continue-on-error это прятал —
      # то есть шаг месяцами не проверял ничего. Причина ниже.
      #
      # Песочница Chromium у ДЕВЕЛОПЕРСКОГО бинарника Electron из node_modules:
      # npm не может выставить SUID-бит при установке, поэтому Chromium находит
      # helper и отказывается запускаться совсем («The SUID sandbox helper binary
      # was found, but is not configured correctly»). Из-за этого шаг сверки на
      # ubuntu не делал НИ ОДНОГО снимка — падал с exit 133 до первого кадра, а
      # continue-on-error это прятал. Запуск с отключённой песочницей здесь не
      # подходит: сверка должна поднимать окна так же, как настоящее приложение.
      #
      # 09.09.2026 шаг стал БЛОКИРУЮЩИМ, и вот в какой части. Сверять картинки
      # на ubuntu по-прежнему не с чем (эталонов в репозитории нет, рендеринг
      # раннера другой) — сверка сама себя пропускает и выходит нулём. Зато
      # проверяемо главное: приложение поднялось и сняло ВСЕ окна. Промах
      # любого кадра теперь возвращает код 4 (scripts/screenshot-runner.js),
      # а не тонет в логе. Ровно этого шагу и не хватало, когда падение
      # Electron под xvfb прожило здесь незамеченным до 2.4.0.
      - name: Visual regression (снимает все окна; сверка — при наличии эталонов)
        run: |
          SANDBOX=node_modules/electron/dist/chrome-sandbox
          # Бинарник Electron скачивается ЛЕНИВО, при первом запуске: сразу после
          # `npm ci` каталога dist/ ещё нет, и выставлять права не на чем — на
          # этом первая версия шага и упала («chown: cannot access»). Поэтому
          # сначала холостой запуск, только потом права.
          npx electron --version >/dev/null 2>&1 || true
          if [ -e "$SANDBOX" ]; then
            sudo chown root:root "$SANDBOX" && sudo chmod 4755 "$SANDBOX"
          else
            echo "[ci] бинарник Electron не появился — права выставлять не на чем"
          fi
          xvfb-run --auto-servernum npm run visual:check
      - name: Upload visual diff artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Coverage (non-blocking)
        run: npm run coverage
        continue-on-error: true

  # ==========================================================================
  # Unit-тесты на Windows и macOS.
  #
  # На ubuntu их гоняет job `build`, и до 2.4.0 этим всё и заканчивалось. Половина
  # тестов здесь — source-level: они читают файл и матчат его текст регулярками,
  # написанными под LF. На Windows Git разворачивает LF в CRLF, и такие проверки
  # разваливаются. Обнаружилось это только в РЕЛИЗНОЙ сборке (она гоняет тесты на
  # каждой платформе): пять падений, четыре из них жили в репозитории с прошлого
  # прохода. Рабочее дерево теперь держит LF через .gitattributes, а этот job не
  # даёт классу «ломается только не на Linux» снова спрятаться до самого релиза.
  # ==========================================================================
  unit-cross-platform:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test

  # ==========================================================================
  # e2e на ТРЁХ платформах — единственное, что проверяет настоящий рантайм.
  #
  # Раньше набор Playwright (создание окон, IPC, геометрия, горячие клавиши,
  # цветовые полосы, раскладка flip, деления, синхронизация состояния окон,
  # палитра перерасхода, углы стрелок) не запускался в CI ВООБЩЕ и прогонялся
  # только вручную на macOS. При этом вся архитектура перетаскивания окон
  # существует именно из-за квирков Windows с прозрачными frameless-окнами —
  # то есть непроверенной оставалась платформа, под которую написан обходной путь.
  #
  # fail-fast: false — падение на одной платформе не должно скрывать результат
  # остальных: нам нужно знать, где именно разошлось поведение.
  # ==========================================================================
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci

      # Electron не поднимет окно без дисплея — под Linux нужен виртуальный.
      # На Windows и macOS у раннера есть сессия рабочего стола.
      - name: Run e2e (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test

      - name: Run e2e (Windows / macOS)
        if: runner.os != 'Linux'
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================================================
  # Сборка без установщика (`electron-builder --dir`) на платформах, которые
  # нельзя проверить с macOS. Ловит поломки упаковки на настоящем инструменте:
  # ассет, не попавший в `build.files` (так в 2.3.2 потерялся design-tokens.css),
  # битый asar, недостижимый icon. Статический `tests/packaging.test.js` сверяет
  # только СПИСОК файлов — здесь пакет собирается по-настоящему.
  # ==========================================================================
  pack:
    name: pack --dir (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Pack without installer
        run: npm run pack
      # Проверяет и состав пакета, и ворота релиза на самом артефакте:
      # закрытый режим разработчика, изоляцию окон, отсутствие автообновления.
      - name: Verify packed app contains every runtime asset
        run: node scripts/verify-packed.js

  # ==========================================================================
  # Песочница Chromium в Linux-пакете. С macOS это не проверяется никак: deb
  # там не собирается, а содержимое postinst видно только в готовом пакете.
  #
  # Что здесь важно. `--no-sandbox` отменял `sandbox: true`, заявленный во всех
  # окнах; сначала он уезжал во все цели, потом оставался у AppImage — и ПСИ
  # Linux-сборку не прошла. AppImage снят, deb ставит профиль AppArmor для user
  # namespaces и SUID-помощник только там, где их нет. Шаг разбирает собранный
  # пакет и проверяет ровно это.
  # ==========================================================================
  linux-sandbox:
    name: linux sandbox (deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build Linux packages
        run: npx electron-builder --linux deb
      - name: Verify sandbox setup in packages
        run: node scripts/verify-linux-sandbox.js
      # Тот же deb уходит на скан и на установку в чистые системы (jobs ниже):
      # пакет собирается ОДИН раз, проверяется ровно он.
      - name: Upload deb for install tests
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 3

  # ==========================================================================
  # Ворота уязвимостей по lockfile и SBOM. Сборка 2.9.0 не прошла ПСИ по
  # критическим уязвимостям Linux-версии; сканер приёмки читал package-lock.json
  # и sbom.json, то есть то же, что есть здесь. Порог — high: high и critical
  # валят job, ниже — предупреждение. Dev-инструментарий включён НАМЕРЕННО:
  # сканер приёмки не отличает dev от runtime. Принятые находки — только
  # записью с причиной и сроком в osv-scanner.toml (сейчас их нет).
  # Подробно: docs/ci.md.
  # ==========================================================================
  security:
    name: security (npm audit + OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      # npm audit читает lockfile — установка зависимостей не нужна.
      - name: npm audit (high и выше блокирует, dev включён)
        run: npm audit --audit-level=high
      # SBOM прикладывается к релизу и читается сканером приёмки: устаревший
      # SBOM сообщает ему чужие версии.
      - name: SBOM совпадает с lockfile
        run: node scripts/security-gate.js sbom-sync
      # OSV-Scanner распознаёт CycloneDX только по имени файла (*.cdx.json).
      - name: Prepare SBOM for OSV-Scanner
        run: cp sbom.json sbom.cdx.json && rm -f osv-results.json
      # Сканер выходит с 1 и при находках, и при собственном сбое; решает
      # следующий шаг по отчёту — он же ловит отсутствие отчёта.
      - name: OSV-Scanner (lockfile + SBOM)
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --all-packages
            --output-file=osv-results.json
            --config=osv-scanner.toml
            --lockfile=package-lock.json
            --lockfile=sbom.cdx.json
      - name: Gate on OSV findings (high/critical или без оценки — провал)
        run: node scripts/security-gate.js osv osv-results.json
      # Chromium внутри бинаря сканеры не видят — только Electron в lockfile.
      # Отставание от последнего патча линии = известные CVE Chromium; в CI это
      # предупреждение, в релизе — провал (release.yml, --require-latest).
      - name: Electron — версия и свежесть
        run: node scripts/security-gate.js electron
      - name: Upload OSV report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: osv-results
          path: osv-results.json
          if-no-files-found: ignore
          retention-days: 14

  # ==========================================================================
  # Скан СОБРАННОГО deb: то, что реально уезжает пользователю, а не lockfile.
  # Grype не опознаёт Electron по бинарю (замер: syft по linux-unpacked —
  # «No packages discovered»), поэтому app.asar распаковывается — так видны
  # npm-пакеты, уехавшие в приложение, — а версия Electron сверяется со
  # строкой `Electron/X.Y.Z` в самом бинаре: SBOM обязан говорить сканеру
  # правду о том, что внутри.
  # ==========================================================================
  deb-scan:
    name: deb scan (Grype)
    needs: linux-sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: linux-deb
          path: deb
      - name: Unpack deb and app.asar
        run: |
          DEB=$(ls deb/*.deb)
          dpkg-deb -x "$DEB" scan-root
          ASAR=$(find scan-root -path '*/resources/app.asar')
          npx --yes @electron/asar@3.4.1 extract "$ASAR" scan-root/app-asar-extracted
          find scan-root/app-asar-extracted -name package.json -path '*node_modules*' | sed 's|.*/node_modules/||' | sort
      - name: Electron в бинаре = lockfile = SBOM
        run: node scripts/security-gate.js electron --binary "$(find scan-root/opt -maxdepth 2 -name timer-widget -type f)"
      - name: Grype (high/critical блокирует)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: scan-root
          fail-build: true
          severity-cutoff: high
          output-format: table
          config: .grype.yaml

  # ==========================================================================
  # Установка deb и ЗАПУСК приложения на настоящем ядре раннера (Ubuntu 24.04,
  # AppArmor включён). Самая ценная проверка: `verify-linux-sandbox.js` читает
  # пакет, а здесь видно, что приложение у обычного пользователя поднимается
  # БЕЗ `--no-sandbox` и его рендереры реально в песочнице (свой namespace,
  # seccomp-bpf). Два пути песочницы — две ячейки матрицы:
  #   userns — kernel.apparmor_restrict_unprivileged_userns=1: работает только
  #            через профиль AppArmor из пакета; chrome-sandbox 0755;
  #   suid   — user.max_user_namespaces=0 (как ядро без userns): postinst
  #            обязан выдать chrome-sandbox 4755 root, и работает SUID-помощник.
  # Проверки — scripts/linux-launch-check.sh.
  # ==========================================================================
  deb-launch-runner:
    name: deb install + launch (runner, ${{ matrix.path }})
    needs: linux-sandbox
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        path: [userns, suid]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-deb
          path: deb
      - name: Kernel knobs for the ${{ matrix.path }} path
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          if [ "${{ matrix.path }}" = suid ]; then
            sudo sysctl -w user.max_user_namespaces=0
          fi
      - name: Install deb
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth dbus ./deb/*.deb
      - name: Launch as non-root user in the sandbox
        run: sudo APP_USER="$(id -un)" ALIVE_SECONDS=15 bash scripts/linux-launch-check.sh --expect ${{ matrix.path }}
      # postrm обязан выгрузить профиль из ядра и убрать файл — иначе после
      # удаления пакета в системе остаётся разрешение userns для пути /opt.
      - name: Remove deb — AppArmor profile goes away
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove -y timer-widget
          if [ -e /etc/apparmor.d/timer-widget ]; then echo "::error::профиль остался в /etc/apparmor.d"; exit 1; fi
          if sudo grep -q '^timer-widget ' /sys/kernel/security/apparmor/profiles; then echo "::error::профиль остался загружен в ядре"; exit 1; fi
          if [ -e /usr/bin/timer-widget ]; then echo "::error::/usr/bin/timer-widget остался"; exit 1; fi
          echo "[remove] OK: профиль выгружен и удалён, ссылки нет"

  # ==========================================================================
  # Установка deb в чистые дистрибутивы. Раннер набит библиотеками, а контейнер
  # — нет: здесь проверяется, что Depends пакета хватает для ЗАПУСКА (поставлены
  # только xvfb и dbus). AppArmor-утилит в контейнере нет, ядро — раннера с
  # kernel.apparmor_restrict_unprivileged_userns=1, поэтому postinst обязан
  # выбрать запасной путь: SUID-помощник. Ему нужны CAP_SYS_ADMIN и свободный
  # clone(), отсюда --privileged — без него песочница Chromium в Docker не
  # поднимается ни одним способом.
  # ==========================================================================
  deb-launch-container:
    name: deb install + launch (${{ matrix.image }}, suid)
    needs: linux-sandbox
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'ubuntu:22.04', 'debian:12']
    container:
      image: ${{ matrix.image }}
      options: --privileged --shm-size=1g
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-deb
          path: deb
      - name: Kernel knob (host kernel, shared)
        run: echo 1 > /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Install deb into a clean system
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends xvfb xauth dbus ./deb/*.deb
          useradd -m tester
      - name: Launch as non-root user in the sandbox
        run: APP_USER=tester ALIVE_SECONDS=15 bash scripts/linux-launch-check.sh --expect suid
