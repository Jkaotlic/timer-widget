name: Node.js CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
      # Визуальная регрессия: поднимаем окна Electron в виртуальном дисплее и
      # сверяем снимки с эталонами из tests/visual-baseline/. Ловит то, что
      # юнит-тесты в принципе не видят — например «жёлтый ноль» и зелёную плашку
      # «ВРЕМЯ ВЫШЛО!», которые прожили в проекте месяцами.
      #
      # Эталоны (tests/visual-baseline/) в репозиторий не кладутся — это 8.6 МБ
      # PNG, которые росли бы с каждой визуальной правкой. Без них шаг просто
      # логирует «эталонов нет» и проходит: смысл его здесь — убедиться, что
      # приложение вообще поднимается и снимает все окна под xvfb.
      # Чтобы шаг реально сверял картинки, эталоны надо снимать на самом
      # раннере (рендеринг ubuntu отличается от macOS) — тогда и убрать флаг.
      - name: Visual regression (non-blocking)
        run: xvfb-run --auto-servernum npm run visual:check
        continue-on-error: true
      - name: Upload visual diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Coverage (non-blocking)
        run: npm run coverage
        continue-on-error: true

  # ==========================================================================
  # e2e на ТРЁХ платформах — единственное, что проверяет настоящий рантайм.
  #
  # Раньше набор Playwright (создание окон, IPC, геометрия, горячие клавиши,
  # цветовые полосы, раскладка flip, деления, синхронизация состояния окон,
  # палитра перерасхода, углы стрелок) не запускался в CI ВООБЩЕ и прогонялся
  # только вручную на macOS. При этом вся архитектура перетаскивания окон
  # существует именно из-за квирков Windows с прозрачными frameless-окнами —
  # то есть непроверенной оставалась платформа, под которую написан обходной путь.
  #
  # fail-fast: false — падение на одной платформе не должно скрывать результат
  # остальных: нам нужно знать, где именно разошлось поведение.
  # ==========================================================================
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci

      # Electron не поднимет окно без дисплея — под Linux нужен виртуальный.
      # На Windows и macOS у раннера есть сессия рабочего стола.
      - name: Run e2e (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test

      - name: Run e2e (Windows / macOS)
        if: runner.os != 'Linux'
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================================================
  # Сборка без установщика (`electron-builder --dir`) на платформах, которые
  # нельзя проверить с macOS. Ловит поломки упаковки на настоящем инструменте:
  # ассет, не попавший в `build.files` (так в 2.3.2 потерялся design-tokens.css),
  # битый asar, недостижимый icon. Статический `tests/packaging.test.js` сверяет
  # только СПИСОК файлов — здесь пакет собирается по-настоящему.
  # ==========================================================================
  pack:
    name: pack --dir (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Pack without installer
        run: npm run pack
      # Проверяет и состав пакета, и ворота релиза на самом артефакте:
      # закрытый режим разработчика, изоляцию окон, отсутствие автообновления.
      - name: Verify packed app contains every runtime asset
        run: node scripts/verify-packed.js

  # ==========================================================================
  # Песочница Chromium в Linux-пакетах. С macOS это не проверяется никак: deb
  # и AppImage там не собираются, а содержимое postinst видно только в готовом
  # пакете.
  #
  # Что здесь важно. Ключ `--no-sandbox` стоял на уровне `linux`, то есть уезжал
  # во ВСЕ цели, включая deb, и отменял `sandbox: true`, заявленный во всех
  # окнах. Теперь он только у AppImage (там нет шага установки, а user namespaces
  # есть не на каждой системе), а deb получает нормальный SUID-помощник из
  # postinst. Шаг разбирает собранные пакеты и проверяет ровно это.
  # ==========================================================================
  linux-sandbox:
    name: linux sandbox (deb + AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build Linux packages
        run: npx electron-builder --linux deb AppImage
      - name: Verify sandbox setup in packages
        run: node scripts/verify-linux-sandbox.js
