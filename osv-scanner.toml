# Принятые находки OSV-Scanner (CI и релиз: job `security`).
#
# Сейчас принятых находок НЕТ. Пустой список — норма, а не забытый файл.
#
# Правило: находка high/critical — или без оценки тяжести — валит сборку
# (scripts/security-gate.js). Принять её можно только записью здесь: с
# причиной, почему она к нам не применима, и со сроком пересмотра. Запись без
# срока не принимается — принятая находка молча становится вечной.
# Сначала пробовать исправление: обновить пакет или `overrides` в package.json
# (так закрыты brace-expansion, @xmldom/xmldom, fast-uri, js-yaml).
#
# Формат:
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-31
# reason = "Достижимо только из dev-инструмента X при условии Y, в пакет не попадает; ждём исправления в X 1.2.3"
